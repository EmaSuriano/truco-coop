<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Truco Coop</title>
  <script type="module" crossorigin src="/truco-coop/pr-preview/pr-9/assets/index-BGZvT6DI.js"></script>
  <link rel="stylesheet" crossorigin href="/truco-coop/pr-preview/pr-9/assets/index-B22o7nvJ.css">
</head>
<body>

<div id="overlay">
  <div id="card">
    <img class="frameCorner tl" alt="">
    <img class="frameCorner tr" alt="">
    <img class="frameCorner bl" alt="">
    <img class="frameCorner br" alt="">
    <h1>
      <img id="titleArt" alt="Truco">
      <span class="titleFallback">Truco Coop</span>
    </h1>
    <p class="sub">Argentine Truco. Host picks table size, then share the link.</p>

    <div class="row" id="tableSizeRow">
      <label>Players</label>
      <div class="choice">
        <label class="choiceOpt"><input type="radio" name="tableSize" id="tableSize2" value="2"> 2 — 1v1</label>
        <label class="choiceOpt"><input type="radio" name="tableSize" id="tableSize4" value="4" checked> 4 — 2v2</label>
      </div>
    </div>

    <div class="row">
      <button class="primary" id="hostBtn">Create Room</button>
    </div>

    <div id="linkRow">
      <label>Share this link</label>
      <div id="linkBox">
        <input type="text" id="linkInput" readonly>
        <button id="copyBtn">Copy</button>
      </div>
    </div>

    <div id="status">Waiting...</div>
  </div>
</div>

<div id="gameWrap">
  <div id="hud">
    <span class="you">■ YOU</span>
    cards: <span id="hudHand">—</span>
    &nbsp;|&nbsp; turn: <span id="hudTurn">—</span>
    &nbsp;|&nbsp; score: <span id="hudScore">—</span>
    &nbsp;|&nbsp;
    <span class="peer">■ PEERS</span> connected: <span id="peerCount">0</span>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="chantBar">
    <img class="chantFlourish" alt="" aria-hidden="true">
    <button id="btnEnvido" disabled>Envido</button>
    <button id="btnReal" disabled>Real Envido</button>
    <button id="btnFalta" disabled>Falta</button>
    <button id="btnTruco" disabled>Truco</button>
    <button id="btnRetruco" disabled>Retruco</button>
    <button id="btnVale" disabled>Vale cuatro</button>
    <button id="btnQuiero" disabled>Quiero</button>
    <button id="btnNo" disabled>No quiero</button>
  </div>
</div>

</body>
</html>
